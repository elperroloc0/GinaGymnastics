<!-- Every style is inline on purpose - Gmail and most other clients strip
     <style> blocks, so anything that isn't inline simply won't render.
     Colors match design/DESIGN-SYSTEM.md in the frontend repo (--blue,
     --ink, --bg, --muted) so this reads as the same product. -->
<!DOCTYPE html>
<html lang="en">
  <body style="margin:0; padding:0; background-color:#F5F5F2; font-family:Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F5F2; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF; border-radius:14px; overflow:hidden;">
            <tr>
              <td style="background-color:#1A18F0; padding:24px 28px;">
                <span style="font-family:Arial Black, Helvetica, sans-serif; font-size:13px; letter-spacing:0.07em; text-transform:uppercase; color:#FFFFFF;">
                  Gina&rsquo;s Gymnastics
                </span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p style="margin:0; font-size:15px; line-height:1.5; color:#17171A;">{{ message }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 24px;">
                <p style="margin:0; font-size:12px; line-height:1.5; color:#6E6E73;">
                  You&rsquo;re receiving this because email is your chosen notification method for Gina&rsquo;s Ride Tracker.
                  Ask the gym to switch you back to text messages if you&rsquo;d rather have those instead.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
